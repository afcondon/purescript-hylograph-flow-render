workspace:
  packageSet:
    registry: 77.13.1
  extraPackages:
    # None of these four is in package set 77.13.1 at the version the
    # ranges below ask for, so each is named at its published version.
    hylograph-flow: "0.2.0"
    hylograph-graph: "0.3.1"
    hylograph-layout: "0.6.0"
    hylograph-selection: "0.6.0"

package:
  name: hylograph-flow-render
  description: >
    The shared drawing of a flow's projection: one layered layout that is a
    plain DAG when every edge is as wide as every other and a Sankey when a
    wire's payload says how wide, and one HATS tree of it.
  publish:
    version: 0.2.0
    license: MIT
    location:
      githubOwner: afcondon
      githubRepo: purescript-hylograph-flow-render
  dependencies:
    - arrays: ">=7.3.0 <8.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - hylograph-flow: ">=0.2.0 <0.3.0"
    - hylograph-graph: ">=0.3.1 <0.4.0"
    - hylograph-layout: ">=0.6.0 <0.7.0"
    - hylograph-selection: ">=0.6.0 <0.7.0"
    - integers: ">=6.0.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - numbers: ">=9.0.1 <10.0.0"
    - ordered-collections: ">=3.2.0 <4.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
  test:
    main: Test.Render
    dependencies:
      - console: ">=6.1.0 <7.0.0"
      - either: ">=6.1.0 <7.0.0"
      - exceptions: ">=6.1.0 <7.0.0"
      - refs: ">=6.0.0 <7.0.0"
